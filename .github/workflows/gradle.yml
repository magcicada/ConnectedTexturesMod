name: Build CTM Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: 'true'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and reobfuscate
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload CTM jars
        uses: actions/upload-artifact@v4
        with:
          name: CTM-Forge-1.20.1-47.4.20-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
